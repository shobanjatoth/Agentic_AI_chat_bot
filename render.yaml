services:
  - type: web
    name: agentic-ai-backend

    runtime: python

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      uvicorn app:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: GOOGLE_API_KEY
        sync: false

      - key: TAVILY_API_KEY
        sync: false


      - key: GEMINI_MODEL
        value: gemini-2.5-flash